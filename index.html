<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fin Flutter Velocity Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" href="fin_flutter_analyzer.ico" type="image/x-icon">

</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 flex items-center gap-4">
            <img
                src="fin_flutter_analyzer.ico"
                alt="Fin Flutter Analyzer Icon"
                class="w-21 h-21"
            >
            <div>
                <h1 class="text-3xl font-bold text-slate-800">
                    Fin Flutter Analyzer
                </h1>
                <p class="text-slate-600">
                    Upload an OpenRocket (.ork) file to auto-calculate flutter velocity margins.
                </p>
            </div>
        </header>


        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold mb-4 text-slate-700">1. Data Source</h2>
                    <div class="space-y-4">
                        <div class="border-2 border-dashed border-indigo-200 rounded-lg p-4 text-center bg-indigo-50/50">
                            <input type="file" id="fileInput" accept=".ork" class="hidden">
                            <label for="fileInput" class="cursor-pointer block">
                                <span class="text-indigo-600 font-medium hover:underline">Select .ork file</span>
                                <p class="text-xs text-slate-500 mt-1" id="fileName">No file chosen</p>
                            </label>
                        </div>
                        <div id="simSelectorContainer" class="hidden">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Select Simulation</label>
                            <select id="simSelector" class="w-full border rounded-md p-2 text-sm bg-white"></select>
                        </div>
                    </div>
                </section>

                <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold mb-4 text-slate-700">2. Fin Parameters</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs uppercase text-slate-500 mb-1">Units</label>
                            <select id="unitSelector" class="w-full border rounded-md p-2 text-sm">
                                <option value="imperial">Imperial (in, ft, ft/s)</option>
                                <option value="metric" selected>Metric (cm, m, m/s)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Material (Shear Modulus)</label>
                            <select id="material" class="w-full border rounded-md p-2 text-sm">
                                <option value="33359">Balsa Wood (33,359 psi)</option>
                                <option value="89000">Birch Plywood (89,000 psi)</option>
                                <option value="600000" selected>G10/G12 Fiberglass (600,000 psi)</option>
                                <option value="600000">Carbon Fiber (600,000 psi)</option>
                                <option value="3800000">6061-T6 Aluminum (3.8M psi)</option>
                                <option value="custom">Custom Value</option>
                            </select>
                        </div>
                        <div id="customGContainer" class="hidden">
                            <input type="number" id="customG" placeholder="Shear Modulus (psi)" class="w-full border rounded-md p-2 text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-xs text-slate-500">Root Chord</label>
                                <div class="flex shadow-xs rounded-base">
                                    <input type="number" id="rootChord" step="any" class="w-full border rounded-md p-2 text-sm">
                                    <span id="rootChordUnit" class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">mm</span>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">Tip Chord</label>
                                <div class="flex shadow-xs rounded-base">
                                    <input type="number" id="tipChord" step="any" class="w-full border rounded-md p-2 text-sm">
                                    <span id="tipChordUnit" class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">mm</span>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">Semi-Span</label>
                                <div class="flex shadow-xs rounded-base">
                                    <input type="number" id="semiSpan" step="any" class="w-full border rounded-md p-2 text-sm">
                                    <span id="semiSpanUnit" class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">mm</span>
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-500">Sweep</label>
                                <div class="flex shadow-xs rounded-base">
                                    <input type="number" id="sweep" step="any" class="w-full border rounded-md p-2 text-sm">
                                    <span id="sweepUnit" class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">mm</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-slate-500">Thickness</label>
                            <div class="flex shadow-xs rounded-base">
                                <input type="number" id="thickness" step="any" class="w-full border rounded-md p-2 text-sm">
                                    <span id="thicknessUnit" class="inline-flex items-center px-3 text-sm text-body bg-neutral-tertiary border rounded-e-0 border-default-medium border-e-0 rounded-s-base">mm</span>
                            </div>
                        </div>
                        <button id="calculateBtn" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-md hover:bg-indigo-700 transition">
                            Update Calculation
                        </button>
                    </div>
                </section>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div id="resultsCard" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold text-slate-800 mb-2">Analysis Results</h2>
                    <div id="minMarginAlert" class="p-4 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-100 mb-6">
                        </div>
                    <div class="h-[400px] w-full">
                        <canvas id="flutterChart"></canvas>
                    </div>
                </div>

                <div id="statusPlaceholder" class="flex items-center justify-center h-full min-h-[400px] text-slate-400 italic">
                    Upload an .ork file to see results...
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
